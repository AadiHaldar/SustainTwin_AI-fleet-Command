version: "3.8"

services:
  db:
    image: postgres:15
    container_name: sustain_twin_db
    restart: always
    environment:
      POSTGRES_USER: sustain_user
      POSTGRES_PASSWORD: sustain_password
      POSTGRES_DB: sustain_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sustain_user -d sustain_twin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: sustain_twin_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sustain_twin_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://sustain_user:sustain_password@db:5432/sustain_twin
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sustain_twin_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend

  edge_simulator:
    build: ./edge
    container_name: sustain_twin_edge
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000/api/v1/telemetry/sync
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
